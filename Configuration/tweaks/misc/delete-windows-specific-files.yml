---
title: Delete Windows-version Specific Tweaks
description: Deletes configuration files that do not apply to the installed Windows version
actions:
    # Delete ARM-specific files
    # FTH files (which are also non-ARM) are deleted in its own YML
  - !powerShell:
    command: |
      Remove-Item -Path """$([Environment]::GetFolderPath('Windows'))\SystemConfig\4. Interface Tweaks\Start Menu\*Open-Shell*""" -Force -Recurse
    wait: true
    cpuArch: 'Arm64'
