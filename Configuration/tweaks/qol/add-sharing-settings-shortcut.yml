---
title: Add Network Sharing Shortcut
description: Adds a network sharing settings shortcut to the System Configuration folder
actions:
  - !powerShell:
    command: |
      .\SystemRuntime\InitializePowerShell.ps1
      New-Shortcut -Source 'control.exe' `
        -Destination """$([Environment]::GetFolderPath('Windows'))\SystemConfig\3. General Configuration\File Sharing\Sharing Settings.lnk""" `
        -Arguments '/name Microsoft.NetworkAndSharingCenter /page Advanced'
    exeDir: true
    wait: true
