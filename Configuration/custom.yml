---
title: Root Playbook File
description: Runs all of the Playbook files
actions:
  # some changes requires default user access. loading the hive before everything else is required
  - !powerShell:
    command: |
      $profileList = Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\ProfileList' -ErrorAction Stop
      $profilesDirectory = [Environment]::ExpandEnvironmentVariables([string]$profileList.ProfilesDirectory)
      if ([string]::IsNullOrWhiteSpace($profilesDirectory)) {
          throw 'Windows did not provide a ProfilesDirectory path.'
      }
      $profilesDirectory = [IO.Path]::GetFullPath($profilesDirectory)
      if (!(Test-Path -LiteralPath $profilesDirectory -PathType Container)) {
          throw "The profiles directory was not found: '$profilesDirectory'."
      }

      $defaultProfile = [Environment]::ExpandEnvironmentVariables([string]$profileList.Default)
      if ([string]::IsNullOrWhiteSpace($defaultProfile)) {
          $defaultProfile = Join-Path $profilesDirectory 'Default'
      } elseif (![IO.Path]::IsPathRooted($defaultProfile)) {
          $defaultProfile = Join-Path $profilesDirectory $defaultProfile
      }
      $defaultProfile = [IO.Path]::GetFullPath($defaultProfile)
      $defaultHive = Join-Path $defaultProfile 'NTUSER.DAT'
      if (!(Test-Path -LiteralPath $defaultHive -PathType Leaf)) {
          throw "The Default User registry hive was not found: '$defaultHive'."
      }

      $mountPath = 'Registry::HKEY_USERS\AME_UserHive_Default'
      if (Test-Path -LiteralPath $mountPath) {
          $regOutput = & reg.exe unload 'HKU\AME_UserHive_Default' 2>&1
          $regExitCode = $LASTEXITCODE
          if ($regExitCode -ne 0) {
              throw "Failed to unload a stale Default User hive (exit $regExitCode): $($regOutput -join ' ')"
          }
      }

      $regOutput = & reg.exe load 'HKU\AME_UserHive_Default' $defaultHive 2>&1
      $regExitCode = $LASTEXITCODE
      if ($regExitCode -ne 0) {
          throw "Failed to load the Default User hive (exit $regExitCode): $($regOutput -join ' ')"
      }
      if (!(Test-Path -LiteralPath $mountPath)) {
          throw 'reg.exe reported success, but the Default User hive is not mounted.'
      }
    oobe: false
    wait: true
    handleExitCodes: { "!0": halt }
  - !writeStatus: { status: "Removing previous configuration files" }
  - !powerShell:
    command: '.\StopConfigurationProcesses.ps1'
    exeDir: true
    onUpgrade: true
    wait: true
    runas: currentUserElevated
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      Remove-Item -LiteralPath "$windir\SystemConfig" -Force -Recurse
      Remove-Item -LiteralPath "$windir\SystemRuntime" -Force -Recurse
    wait: true
    exeDir: true
    oobe: false
    onUpgrade: true

  - !writeStatus: { status: "Copying files" }
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      @(
          'SystemRuntime',
          'SystemConfig'
      ) | ForEach-Object {
          if (!(Test-Path $_)) { exit 1 }
          Copy-Item -Path $_ -Destination $windir -Force -Recurse
          if (!$?) { exit 2 }
      }
      Start-Process -FilePath """$windir\SystemConfig\6. Advanced Configuration\Process Explorer\Uninstall Process Explorer.cmd""" -ArgumentList "/silent" -WindowStyle Hidden
    weight: 10
    wait: true
    exeDir: true
    handleExitCodes: { "!0": halt }

  # Prevent annoying notifications during deployment
  - !cmd:
    command: "DisableNotifications.cmd"
    exeDir: true
    wait: true
    runas: currentUserElevated
  - !taskKill: { name: "explorer" }
  - !taskKill: { name: "ShellExperienceHost" }
  - !run: { exe: "explorer.exe", runas: "currentUser", wait: false }

  # Configure PowerShell first so that other PowerShell scripts work
  # NGEN - .NET assemblies PowerShell optimization
  - !writeStatus: { status: "Optimizing PowerShell" }
  - !task: { path: 'tweaks\scripts\optimize-powershell-ngen.yml' }
  - !task: { path: 'tweaks\qol\config-powershell.yml' }

  # Disk Cleanup is run first and completes before the remaining tasks
  - !writeStatus: { status: "Cleaning up" }
  - !powerShell:
    command: '.\RunDiskCleanup.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Set hidden Settings pages
  # Done before everything else as scripts will overwrite it
  - !task: { path: 'tweaks\qol\set-hidden-settings-pages.yml' }

  # Main tasks
  - !task: { path: 'core\start.yml' }
  - !task: { path: 'core\services.yml' }
  - !task: { path: 'core\components.yml' }
  - !task: { path: 'core\appx.yml' }
  - !task: { path: 'core\default.yml' }
  - !task: { path: 'core\revert.yml' }
  - !task: { path: "tweaks.yml" }

  # Set hives to HKU default user
  - !writeStatus: { status: "Applying hives..." }
  - !powerShell:
    command: '.\ApplyDefaultUserHive.ps1'
    exeDir: true
    wait: true
    runas: currentUserElevated

  # Unloading the hive
  - !powerShell:
    command: |
      $regOutput = & reg.exe unload 'HKU\AME_UserHive_Default' 2>&1
      $regExitCode = $LASTEXITCODE
      if ($regExitCode -ne 0) {
          throw "Failed to unload the Default User hive (exit $regExitCode): $($regOutput -join ' ')"
      }
      if (Test-Path -LiteralPath 'Registry::HKEY_USERS\AME_UserHive_Default') {
          throw 'reg.exe reported success, but the Default User hive is still mounted.'
      }
    oobe: false
    wait: true
    handleExitCodes: { "!0": halt }

  # Set PowerShell execution policy to RemoteSigned from the previous "Unrestricted"
  # This allows local configuration scripts to run while requiring signatures for downloaded scripts
  - !writeStatus: { status: "Securing PowerShell execution policy" }
  - !registryValue:
    path: 'HKLM\SOFTWARE\Microsoft\PowerShell\1\ShellIds\Microsoft.PowerShell'
    value: 'ExecutionPolicy'
    data: 'RemoteSigned'
    type: REG_SZ
